<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">CodeIdiomMine</title>
  <desc id="desc">Animated C++ fragments converging into semantic clusters and reusable idiom knowledge.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.52" stop-color="#0b1230"/>
      <stop offset="1" stop-color="#111133"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#72e4ff"/>
      <stop offset="0.48" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".28"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity=".07"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".4"/>
    </filter>
    <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="panel-clip"><rect x="660" y="48" width="486" height="324" rx="24"/></clipPath>
    <path id="flow-a" d="M746 132 C832 132 825 209 900 209 S986 121 1064 150"/>
    <path id="flow-b" d="M748 272 C820 272 838 225 900 225 S990 300 1068 274"/>
    <style>
      .dash { stroke-dasharray: 7 11; animation: dash 7s linear infinite; }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.8s ease-in-out infinite; }
      .pulse-late { animation-delay: 1.1s; }
      .float { animation: float 5s ease-in-out infinite; }
      @keyframes dash { to { stroke-dashoffset: -180; } }
      @keyframes pulse { 0%,100% { opacity:.55; transform:scale(.9) } 50% { opacity:1; transform:scale(1.18) } }
      @keyframes float { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-7px) } }
    </style>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <circle cx="1035" cy="72" r="270" fill="url(#glow)"/>
  <path d="M0 353C220 292 351 429 572 349S972 301 1200 358V420H0Z" fill="#020617" opacity=".52"/>

  <g transform="translate(62 62)">
    <g transform="translate(0 2)">
      <rect width="46" height="46" rx="13" fill="#111936" stroke="#6ee7f9" stroke-opacity=".55"/>
      <path d="M16 15l-8 8 8 8M30 15l8 8-8 8M26 11l-6 24" fill="none" stroke="url(#brand)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="0" y="106" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="53" font-weight="750" letter-spacing="-2">CodeIdiomMine</text>
    <rect x="1" y="121" width="401" height="4" rx="2" fill="url(#brand)"/>
    <text x="1" y="159" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">From raw C++ repositories to reusable semantic knowledge</text>
    <text x="1" y="190" fill="#7dd3fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.6">ZERO-BUILD AST  /  SEMANTIC CLUSTERS  /  AGENTIC QUALITY GATES</text>

    <g transform="translate(0 229)" font-family="Inter,Segoe UI,Arial,sans-serif">
      <g>
        <rect width="142" height="67" rx="16" fill="#0f1734" stroke="#38bdf8" stroke-opacity=".35"/>
        <text x="18" y="29" fill="#f8fafc" font-size="22" font-weight="750">268</text>
        <text x="18" y="50" fill="#94a3b8" font-size="12">final idioms</text>
      </g>
      <g transform="translate(155)">
        <rect width="142" height="67" rx="16" fill="#0f1734" stroke="#a78bfa" stroke-opacity=".38"/>
        <text x="18" y="29" fill="#f8fafc" font-size="22" font-weight="750">3</text>
        <text x="18" y="50" fill="#94a3b8" font-size="12">full repositories</text>
      </g>
      <g transform="translate(310)">
        <rect width="142" height="67" rx="16" fill="#0f1734" stroke="#f472b6" stroke-opacity=".38"/>
        <text x="18" y="29" fill="#f8fafc" font-size="22" font-weight="750">0.5793</text>
        <text x="18" y="50" fill="#94a3b8" font-size="12">macro F1</text>
      </g>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="660" y="48" width="486" height="324" rx="24" fill="#090f25" stroke="#64748b" stroke-opacity=".32"/>
  </g>
  <g clip-path="url(#panel-clip)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <rect x="660" y="48" width="486" height="42" fill="#101936"/>
    <circle cx="687" cy="69" r="5" fill="#fb7185"/><circle cx="705" cy="69" r="5" fill="#fbbf24"/><circle cx="723" cy="69" r="5" fill="#34d399"/>
    <text x="754" y="74" fill="#94a3b8" font-size="12">semantic-mining.pipeline</text>

    <g class="float">
      <rect x="686" y="111" width="132" height="58" rx="12" fill="#101a37" stroke="#38bdf8" stroke-opacity=".45"/>
      <text x="701" y="135" fill="#7dd3fc" font-size="11">if (!status.ok())</text>
      <text x="701" y="153" fill="#cbd5e1" font-size="11">  return error;</text>
      <rect x="686" y="250" width="132" height="58" rx="12" fill="#101a37" stroke="#a78bfa" stroke-opacity=".45"/>
      <text x="701" y="274" fill="#c4b5fd" font-size="11">std::move(value)</text>
      <text x="701" y="292" fill="#cbd5e1" font-size="11">preserve category</text>
    </g>

    <path d="M746 132 C832 132 825 209 900 209 S986 121 1064 150" fill="none" stroke="#38bdf8" stroke-opacity=".45" stroke-width="2" class="dash"/>
    <path d="M748 272 C820 272 838 225 900 225 S990 300 1068 274" fill="none" stroke="#a78bfa" stroke-opacity=".48" stroke-width="2" class="dash"/>
    <path d="M840 180C876 174 888 191 905 208M840 252C875 255 887 240 905 226" fill="none" stroke="#64748b" stroke-opacity=".45"/>

    <g fill="#0e1834" stroke-width="2">
      <circle cx="900" cy="217" r="45" stroke="#8b5cf6"/>
      <circle cx="900" cy="217" r="28" stroke="#22d3ee" stroke-opacity=".8"/>
      <circle cx="900" cy="217" r="8" fill="#f8fafc" stroke="#f8fafc" class="pulse" filter="url(#soft-glow)"/>
      <circle cx="862" cy="183" r="6" fill="#38bdf8" stroke="#38bdf8" class="pulse pulse-late"/>
      <circle cx="946" cy="193" r="6" fill="#c084fc" stroke="#c084fc" class="pulse"/>
      <circle cx="937" cy="250" r="6" fill="#f472b6" stroke="#f472b6" class="pulse pulse-late"/>
      <circle cx="854" cy="248" r="6" fill="#67e8f9" stroke="#67e8f9" class="pulse"/>
    </g>

    <g>
      <rect x="1000" y="112" width="116" height="74" rx="14" fill="#101a37" stroke="#38bdf8" stroke-opacity=".45"/>
      <text x="1015" y="137" fill="#e2e8f0" font-size="11">SEMANTIC</text><text x="1015" y="156" fill="#7dd3fc" font-size="11">intent + reuse</text><text x="1015" y="174" fill="#64748b" font-size="10">score 93.8</text>
      <rect x="1000" y="244" width="116" height="74" rx="14" fill="#101a37" stroke="#f472b6" stroke-opacity=".45"/>
      <text x="1015" y="269" fill="#e2e8f0" font-size="11">SYNTHESIS</text><text x="1015" y="288" fill="#f9a8d4" font-size="11">related idioms</text><text x="1015" y="306" fill="#64748b" font-size="10">quality 96</text>
    </g>

    <circle r="4" fill="#e0f2fe" filter="url(#soft-glow)"><animateMotion dur="3.8s" repeatCount="indefinite"><mpath href="#flow-a"/></animateMotion></circle>
    <circle r="4" fill="#f5d0fe" filter="url(#soft-glow)"><animateMotion dur="4.4s" begin="-1.7s" repeatCount="indefinite"><mpath href="#flow-b"/></animateMotion></circle>
  </g>
  <rect x=".5" y=".5" width="1199" height="419" rx="27.5" fill="none" stroke="url(#brand)" stroke-opacity=".35"/>
</svg>
